[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infragraph"
version = "1.0.0"
description = "Multi-Source Attack Surface Graph & Orphan Asset Tracker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dnspython>=2.6.0",
    "networkx>=3.0",
    "rich>=13.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "click>=8.1.0"
]

[project.scripts]
infragraph = "infragraph.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "anyio[trio]>=4.0",
    "httpx2>=0.28.0",
]

