<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ReconEngine{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6' },
          }
        }
      }
    }
  </script>

  <!-- HTMX CDN -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .badge-critical { @apply bg-red-600 text-white; }
    .badge-high     { @apply bg-orange-500 text-white; }
    .badge-medium   { @apply bg-yellow-500 text-black; }
    .badge-low      { @apply bg-green-600 text-white; }
    .nav-link       { @apply flex items-center gap-2 px-4 py-2 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition-colors; }
    .nav-link.active { @apply bg-brand-600 text-white; }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Sidebar -->
  <div class="flex min-h-screen">
    <aside class="w-60 bg-slate-800 border-r border-slate-700 flex flex-col fixed h-full">
      <!-- Logo -->
      <div class="px-6 py-5 border-b border-slate-700">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
            </svg>
          </div>
          <span class="font-bold text-white text-sm tracking-wide">ReconEngine</span>
        </div>
      </div>

      <!-- Nav Links -->
      <nav class="flex-1 p-4 space-y-1">
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Overview
        </a>
        <a href="/domains" class="nav-link {% if '/domains' in request.url.path %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/>
          </svg>
          Domains
        </a>
        <a href="/endpoints" class="nav-link {% if '/endpoints' in request.url.path %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
          </svg>
          Endpoints
        </a>
        <a href="/diffs" class="nav-link {% if '/diffs' in request.url.path %}active{% endif %}">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          Diff Alerts
          {% if unread_diffs is defined and unread_diffs %}
          <span class="ml-auto bg-red-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-full">{{ unread_diffs }}</span>
          {% endif %}
        </a>
      </nav>

      <!-- Footer -->
      <div class="p-4 border-t border-slate-700 text-xs text-slate-500">
        <div>ReconEngine v1.0</div>
        <div class="text-slate-600">{{ request.url.hostname }}</div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="ml-60 flex-1 p-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
